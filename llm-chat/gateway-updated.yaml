apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: akamai-poc-gateway
  namespace: nginx-gateway
  annotations:
    service.beta.kubernetes.io/linode-loadbalancer-default-protocol: "tcp"
    service.beta.kubernetes.io/linode-loadbalancer-check-type: "http"
    service.beta.kubernetes.io/linode-loadbalancer-check-path: "/health"
    service.beta.kubernetes.io/linode-loadbalancer-check-interval: "10"
    service.beta.kubernetes.io/linode-loadbalancer-check-timeout: "5"
    service.beta.kubernetes.io/linode-loadbalancer-check-attempts: "3"
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https-llm
      port: 443
      protocol: HTTPS
      hostname: llm-ops.akamai-poc.online
      tls:
        mode: Terminate
        certificateRefs:
          - name: llm-ops-tls-secret
            namespace: nginx-gateway
      allowedRoutes:
        namespaces:
          from: All
    - name: https-grafana
      port: 443
      protocol: HTTPS
      hostname: grafana-llm.akamai-poc.online
      tls:
        mode: Terminate
        certificateRefs:
          - name: grafana-llm-tls-secret
            namespace: nginx-gateway
      allowedRoutes:
        namespaces:
          from: All
    - name: https-chat
      port: 443
      protocol: HTTPS
      hostname: chat.akamai-poc.online
      tls:
        mode: Terminate
        certificateRefs:
          - name: chat-tls-secret
            namespace: nginx-gateway
      allowedRoutes:
        namespaces:
          from: All
