# Template only — do not apply as-is or commit a real token.
#
# Generate and apply the real secret out-of-band instead:
#   kubectl create secret generic loadtest-token \
#     -n llm-serving \
#     --from-literal=token="$(openssl rand -hex 24)"
#
# Then give that same token to whoever operates the console — it's what the
# "Load Test" panel asks for the first time someone clicks Start.
apiVersion: v1
kind: Secret
metadata:
  name: loadtest-token
  namespace: llm-serving
type: Opaque
stringData:
  token: "REPLACE_ME"
