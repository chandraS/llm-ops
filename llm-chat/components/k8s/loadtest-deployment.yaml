apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadtest-api
  namespace: llm-serving
  labels:
    app: loadtest-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadtest-api
  template:
    metadata:
      labels:
        app: loadtest-api
    spec:
      containers:
        - name: loadtest-api
          image: shicha/loadtest-api:v3
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VLLM_URL
              value: "http://qwen25-7b.llm-serving.svc.cluster.local:8000/v1/chat/completions"
            - name: MODEL_NAME
              value: "qwen25-7b"
            - name: LOADTEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: loadtest-token
                  key: token
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-access-token
                  key: token
            - name: GITHUB_REPO
              value: "chandraS/llm-ops"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/loadtest/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: loadtest-api
  namespace: llm-serving
  labels:
    app: loadtest-api
spec:
  selector:
    app: loadtest-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
