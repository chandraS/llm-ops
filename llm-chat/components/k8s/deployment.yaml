apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-chat-ui
  namespace: llm-serving
  labels:
    app: llm-chat-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-chat-ui
  template:
    metadata:
      labels:
        app: llm-chat-ui
    spec:
      containers:
        - name: chat-ui
          image: shicha/llm-chat-ui:v8
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llm-chat-ui
  namespace: llm-serving
  labels:
    app: llm-chat-ui
spec:
  selector:
    app: llm-chat-ui
  ports:
    - name: http
      port: 80
      targetPort: 80
